<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budgets – My Financial Partner</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="page-header" id="pageHeader"></header>
      <div class="page-body">

        <!-- Month selector + Add Budget -->
        <div class="d-flex align-center justify-between mb-24" style="flex-wrap:wrap;gap:12px">
          <div id="monthSelectorWrap"></div>
          <button class="btn btn-primary btn-sm" onclick="openAddBudgetModal()">
            <i data-lucide="plus"></i> Set Budget
          </button>
        </div>

        <!-- Budget overview strip -->
        <div class="stat-grid stagger mb-24" id="budgetStats" style="grid-template-columns:repeat(3,1fr)">
          <div class="stat-card" style="--stat-color:#10b981;--stat-bg:#ecfdf5">
            <div class="stat-icon"><i data-lucide="target"></i></div>
            <div class="stat-info">
              <div class="stat-label">Total Budgeted</div>
              <div class="stat-value" id="statBudgeted">₹—</div>
            </div>
          </div>
          <div class="stat-card" style="--stat-color:#ef4444;--stat-bg:#fee2e2">
            <div class="stat-icon"><i data-lucide="trending-down"></i></div>
            <div class="stat-info">
              <div class="stat-label">Total Spent</div>
              <div class="stat-value" id="statSpent">₹—</div>
            </div>
          </div>
          <div class="stat-card" style="--stat-color:#8b5cf6;--stat-bg:#ede9fe">
            <div class="stat-icon"><i data-lucide="wallet"></i></div>
            <div class="stat-info">
              <div class="stat-label">Total Remaining</div>
              <div class="stat-value" id="statRemaining">₹—</div>
            </div>
          </div>
        </div>

        <!-- Budget List -->
        <div class="card">
          <div class="card-header">
            <span class="card-title"><i data-lucide="target"></i> Budget Categories</span>
          </div>
          <div class="card-body" id="budgetList">
            <div class="loading-overlay"><div class="spinner"></div><span>Loading budgets…</span></div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>
  <div id="toastContainer" class="toast-container"></div>

  <!-- Add Budget Modal -->
  <div class="modal-overlay" id="addBudgetModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Set Budget Limit</span>
        <button class="modal-close" onclick="closeModal('addBudgetModal')">
          <i data-lucide="x" style="width:16px;height:16px"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Category *</label>
          <select id="budgetCategory" class="form-control">
            <option value="">Select category</option>
            <option>Rent</option><option>Food</option><option>Groceries</option>
            <option>Travel</option><option>Petrol</option><option>Mobile Recharge</option>
            <option>Internet</option><option>Fashion</option><option>Accessories</option>
            <option>Shopping</option><option>Medical</option><option>Education</option>
            <option>Entertainment</option><option>Subscriptions</option><option>EMI / Loan</option>
            <option>Family Expenses</option><option>Personal Care</option><option>Other Expenses</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Monthly Limit (₹) *</label>
          <div class="input-group">
            <span class="input-prefix">₹</span>
            <input id="budgetLimit" type="number" class="form-control" placeholder="0.00" min="1" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('addBudgetModal')">Cancel</button>
        <button class="btn btn-primary" id="saveBudgetBtn" onclick="handleSaveBudget()">
          <i data-lucide="check"></i> Save Budget
        </button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/budgets.js"></script>
  <script>
    if (!requireAuth()) { /* redirected */ }
    else {
      lucide.createIcons();
      initPage('Budgets');
      initBudgetsPage();
    }
  </script>
</body>
</html>
