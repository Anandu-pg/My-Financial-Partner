<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transactions – My Financial Partner</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="page-header" id="pageHeader"></header>
      <div class="page-body">

        <!-- Filter Bar -->
        <div class="filter-bar">
          <div class="search-wrap">
            <i data-lucide="search"></i>
            <input id="searchInput" type="text" class="form-control" placeholder="Search description, category…" />
          </div>
          <select id="typeFilter" class="form-control" style="min-width:130px;flex:0">
            <option value="">All Types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <select id="categoryFilter" class="form-control" style="min-width:150px;flex:0">
            <option value="">All Categories</option>
          </select>
          <input id="dateFrom" type="date" class="form-control" style="flex:0;min-width:140px" />
          <input id="dateTo"   type="date" class="form-control" style="flex:0;min-width:140px" />
          <div id="monthSelectorWrap"></div>
          <button id="clearFilters" class="btn btn-secondary btn-sm">
            <i data-lucide="x"></i> Clear
          </button>
        </div>

        <!-- Summary bar -->
        <div style="display:flex;gap:18px;margin-bottom:18px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:8px;font-size:.85rem">
            <span style="color:var(--text-muted)">Showing</span>
            <strong id="txCount">—</strong>
            <span style="color:var(--text-muted)">transactions</span>
          </div>
          <div style="display:flex;gap:18px;margin-left:auto">
            <span style="font-size:.83rem;color:var(--success);font-weight:700" id="totalIncome">—</span>
            <span style="font-size:.83rem;color:var(--danger);font-weight:700"  id="totalExpense">—</span>
          </div>
        </div>

        <!-- Table -->
        <div class="table-wrapper" id="txTableWrap">
          <div class="loading-overlay"><div class="spinner"></div><span>Loading transactions…</span></div>
        </div>

        <!-- Pagination -->
        <div id="pagination" style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px"></div>

      </div>
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>
  <div id="toastContainer" class="toast-container"></div>

  <!-- Edit Transaction Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Edit Transaction</span>
        <button class="modal-close" onclick="closeModal('editModal')"><i data-lucide="x" style="width:16px;height:16px"></i></button>
      </div>
      <div class="modal-body">
        <form id="editForm">
          <input type="hidden" id="editTxId" />
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Type</label>
              <select id="editType" class="form-control">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Amount (₹)</label>
              <input id="editAmount" type="number" class="form-control" min="0.01" step="0.01" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Category</label>
              <select id="editCategory" class="form-control"></select>
            </div>
            <div class="form-group">
              <label class="form-label">Date</label>
              <input id="editDate" type="date" class="form-control" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Description</label>
            <input id="editDescription" type="text" class="form-control" placeholder="Optional description" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Payment Method</label>
              <select id="editPaymentMethod" class="form-control">
                <option>Cash</option>
                <option>UPI</option>
                <option>Card</option>
                <option>Net Banking</option>
                <option>Cheque</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Account</label>
              <select id="editAccount" class="form-control"></select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Notes</label>
            <textarea id="editNotes" class="form-control" rows="2" placeholder="Optional notes"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('editModal')">Cancel</button>
        <button class="btn btn-primary" id="saveEditBtn" onclick="saveEditTransaction()">
          <i data-lucide="check"></i> Save Changes
        </button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/transactions.js"></script>
  <script>
    if (!requireAuth()) { /* redirected */ }
    else {
      lucide.createIcons();
      initPage('Transactions');
      initTransactions();
    }
  </script>
</body>
</html>
