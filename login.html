<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – My Financial Partner</title>
  <meta name="description" content="Sign in to My Financial Partner to manage your personal finances." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="auth-page">
    <!-- Theme toggle -->
    <button class="theme-toggle" id="themeToggle"
      style="position:fixed;top:20px;right:20px;z-index:10"
      title="Toggle theme">
      <i data-lucide="moon"></i>
    </button>

    <div class="auth-card animate-fade">
      <!-- Brand -->
      <div class="auth-logo">
        <div class="auth-brand-icon">
          <i data-lucide="wallet"></i>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your account</p>
      </div>

      <!-- Global error -->
      <div id="globalError" class="form-error"
        style="display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);
               border-radius:8px;padding:10px 14px;margin-bottom:18px;color:#ef4444;font-size:.82rem">
        <i data-lucide="alert-circle" style="width:15px;height:15px;flex-shrink:0"></i>
        <span></span>
      </div>

      <!-- Form -->
      <form id="loginForm" novalidate autocomplete="off">
        <!-- Username -->
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-group">
            <i data-lucide="user" class="input-prefix" style="width:16px;height:16px"></i>
            <input
              id="username"
              type="text"
              class="form-control"
              placeholder="Enter your username"
              autocomplete="username"
              maxlength="30"
              required
            />
          </div>
        </div>

        <!-- PIN -->
        <div class="form-group">
          <label class="form-label">4-Digit PIN</label>
          <div id="pinRow" class="pin-input-row">
            <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" aria-label="PIN digit 1" />
            <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" aria-label="PIN digit 2" />
            <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" aria-label="PIN digit 3" />
            <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" aria-label="PIN digit 4" />
          </div>
        </div>

        <!-- Submit -->
        <button id="loginBtn" type="submit" class="btn btn-primary w-100 btn-lg" style="margin-top:8px">
          <i data-lucide="log-in"></i> Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account?
        <a href="register.html">Create one free</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    lucide.createIcons();
    initLoginPage();
  </script>
</body>
</html>
