<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Expense – My Financial Partner</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="page-header" id="pageHeader"></header>
      <div class="page-body">

        <div class="two-col-layout">

          <!-- Add Expense Form -->
          <div class="card animate-fade">
            <div class="card-header">
              <span class="card-title" style="color:var(--danger)">
                <i data-lucide="trending-down"></i> Add Expense
              </span>
            </div>
            <div class="card-body">
              <form id="expenseForm" novalidate>

                <div class="form-group">
                  <label class="form-label">Amount (₹) *</label>
                  <div class="input-group">
                    <span class="input-prefix">₹</span>
                    <input id="expAmount" type="number" class="form-control" placeholder="0.00" min="0.01" step="0.01" required />
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">Category *</label>
                  <select id="expCategory" class="form-control" required>
                    <option value="">Select category</option>
                    <optgroup label="Housing & Utilities">
                      <option>Rent</option>
                      <option>Internet</option>
                      <option>Mobile Recharge</option>
                    </optgroup>
                    <optgroup label="Food">
                      <option>Food</option>
                      <option>Groceries</option>
                    </optgroup>
                    <optgroup label="Transport">
                      <option>Travel</option>
                      <option>Petrol</option>
                    </optgroup>
                    <optgroup label="Shopping">
                      <option>Fashion</option>
                      <option>Accessories</option>
                      <option>Shopping</option>
                    </optgroup>
                    <optgroup label="Health & Education">
                      <option>Medical</option>
                      <option>Education</option>
                    </optgroup>
                    <optgroup label="Lifestyle">
                      <option>Entertainment</option>
                      <option>Subscriptions</option>
                      <option>Personal Care</option>
                    </optgroup>
                    <optgroup label="Finance">
                      <option>EMI / Loan</option>
                      <option>Savings</option>
                    </optgroup>
                    <optgroup label="Other">
                      <option>Family Expenses</option>
                      <option>Other Expenses</option>
                    </optgroup>
                  </select>
                </div>

                <div id="expCustomCatWrap" class="form-group" style="display:none">
                  <label class="form-label">Custom Category Name</label>
                  <input id="expCustomCategory" type="text" class="form-control" placeholder="Enter category name" />
                </div>

                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Date *</label>
                    <input id="expDate" type="date" class="form-control" required />
                  </div>
                  <div class="form-group">
                    <label class="form-label">Payment Method</label>
                    <select id="expPaymentMethod" class="form-control">
                      <option>Cash</option>
                      <option>UPI</option>
                      <option>Card</option>
                      <option>Net Banking</option>
                      <option>Cheque</option>
                      <option>Wallet</option>
                    </select>
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">Account</label>
                  <select id="expAccount" class="form-control">
                    <option value="">— None —</option>
                  </select>
                </div>

                <div class="form-group">
                  <label class="form-label">Description</label>
                  <input id="expDescription" type="text" class="form-control" placeholder="Brief description (optional)" />
                </div>

                <div class="form-group">
                  <label class="form-label">Notes</label>
                  <textarea id="expNotes" class="form-control" rows="2" placeholder="Additional notes…"></textarea>
                </div>

                <div id="expError" class="form-error" style="display:none;margin-bottom:12px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);padding:10px;border-radius:8px">
                  <i data-lucide="alert-circle" style="width:14px;height:14px;flex-shrink:0"></i>
                  <span></span>
                </div>

                <button id="expSubmitBtn" type="submit" class="btn btn-danger w-100">
                  <i data-lucide="minus-circle"></i> Add Expense
                </button>
              </form>
            </div>
          </div>

          <!-- Recent Expenses list -->
          <div>
            <div class="section-header">
              <h2 class="section-title">Recent Expenses</h2>
              <a href="transactions.html" class="btn btn-ghost btn-sm">View all</a>
            </div>
            <div id="recentExpenseList">
              <div class="loading-overlay"><div class="spinner"></div><span>Loading…</span></div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>
  <div id="toastContainer" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/expenses.js"></script>
  <script>
    if (!requireAuth()) { /* redirected */ }
    else {
      lucide.createIcons();
      initPage('Add Expense');
      initExpensePage();
    }
  </script>
</body>
</html>
