<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Income – My Financial Partner</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="page-header" id="pageHeader"></header>
      <div class="page-body">

        <div class="two-col-layout">

          <!-- Add Income Form -->
          <div class="card animate-fade">
            <div class="card-header">
              <span class="card-title" style="color:var(--success)">
                <i data-lucide="trending-up"></i> Add Income
              </span>
            </div>
            <div class="card-body">
              <form id="incomeForm" novalidate>
                <div class="form-group">
                  <label class="form-label">Amount (₹) *</label>
                  <div class="input-group">
                    <span class="input-prefix">₹</span>
                    <input id="incAmount" type="number" class="form-control" placeholder="0.00" min="0.01" step="0.01" required />
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">Category *</label>
                  <select id="incCategory" class="form-control" required>
                    <option value="">Select category</option>
                    <option>Salary</option>
                    <option>Freelance</option>
                    <option>Bonus</option>
                    <option>Business Income</option>
                    <option>Investment Returns</option>
                    <option>Gift</option>
                    <option>Other Income</option>
                  </select>
                </div>

                <div id="customCatWrap" class="form-group" style="display:none">
                  <label class="form-label">Custom Category Name</label>
                  <input id="incCustomCategory" type="text" class="form-control" placeholder="Enter category name" />
                </div>

                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Date *</label>
                    <input id="incDate" type="date" class="form-control" required />
                  </div>
                  <div class="form-group">
                    <label class="form-label">Payment Method</label>
                    <select id="incPaymentMethod" class="form-control">
                      <option>Cash</option>
                      <option>UPI</option>
                      <option>Bank Transfer</option>
                      <option>Cheque</option>
                      <option>Card</option>
                    </select>
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">Account</label>
                  <select id="incAccount" class="form-control">
                    <option value="">— None —</option>
                  </select>
                </div>

                <div class="form-group">
                  <label class="form-label">Description</label>
                  <input id="incDescription" type="text" class="form-control" placeholder="Brief description (optional)" />
                </div>

                <div class="form-group">
                  <label class="form-label">Notes</label>
                  <textarea id="incNotes" class="form-control" rows="2" placeholder="Additional notes…"></textarea>
                </div>

                <div id="incError" class="form-error" style="display:none;margin-bottom:12px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);padding:10px;border-radius:8px">
                  <i data-lucide="alert-circle" style="width:14px;height:14px;flex-shrink:0"></i>
                  <span></span>
                </div>

                <button id="incSubmitBtn" type="submit" class="btn btn-primary w-100">
                  <i data-lucide="plus-circle"></i> Add Income
                </button>
              </form>
            </div>
          </div>

          <!-- Recent Income list -->
          <div>
            <div class="section-header">
              <h2 class="section-title">Recent Income</h2>
              <a href="transactions.html" class="btn btn-ghost btn-sm">View all</a>
            </div>
            <div id="recentIncomeList">
              <div class="loading-overlay"><div class="spinner"></div><span>Loading…</span></div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>
  <div id="toastContainer" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/income.js"></script>
  <script>
    if (!requireAuth()) { /* redirected */ }
    else {
      lucide.createIcons();
      initPage('Add Income');
      initIncomePage();
    }
  </script>
</body>
</html>
