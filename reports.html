<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports – My Financial Partner</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="page-header" id="pageHeader"></header>
      <div class="page-body">

        <!-- Report type tabs -->
        <div class="report-tabs" id="reportTabs">
          <button class="report-tab active" data-tab="monthly" onclick="switchTab('monthly', this)">
            Monthly Report
          </button>
          <button class="report-tab" data-tab="yearly" onclick="switchTab('yearly', this)">
            Yearly Report
          </button>
          <button class="report-tab" data-tab="categories" onclick="switchTab('categories', this)">
            By Category
          </button>
          <button class="report-tab" data-tab="daily" onclick="switchTab('daily', this)">
            Daily Trends
          </button>
        </div>

        <!-- Controls: month/year selector + export buttons -->
        <div class="d-flex align-center justify-between mb-24" style="flex-wrap:wrap;gap:12px">
          <div id="reportSelectorWrap"></div>
          <div class="d-flex gap-8">
            <button class="btn btn-secondary btn-sm" onclick="exportCSV()">
              <i data-lucide="download"></i> Export CSV
            </button>
            <button class="btn btn-secondary btn-sm" onclick="exportPDF()">
              <i data-lucide="file-text"></i> Export PDF
            </button>
          </div>
        </div>

        <!-- Summary stat cards (monthly/yearly) -->
        <div class="stat-grid stagger mb-24" id="reportStats">
          <!-- Filled by JS -->
        </div>

        <!-- Charts section -->
        <div id="reportCharts" style="margin-bottom:24px"></div>

        <!-- Table section -->
        <div id="reportTable"></div>

      </div>
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>
  <div id="toastContainer" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reports.js"></script>
  <script>
    if (!requireAuth()) { /* redirected */ }
    else {
      lucide.createIcons();
      initPage('Reports & Analytics');
      initReportsPage();
    }
  </script>
</body>
</html>
